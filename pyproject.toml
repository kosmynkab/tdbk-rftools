[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tdbk-rftools"
version = "1.0.0"
description = "Measuring, point layout and designspace cleanup tools for RoboFont"
requires-python = ">=3.12"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["TDBKRFTools.roboFontExt/lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"   # RoboFont 4.6's bundled Python

[tool.ruff.lint]
# Errors only: undefined names, unused imports and variables, syntax errors.
select = ["E9", "F"]
